content:
  - name: site
    label: Coming Soon page
    type: file
    path: content.json
    format: json
    fields:
      - { name: headline, label: Headline, type: string }
      - { name: tagline, label: Tagline, type: string }
      - { name: address, label: Street address, type: string }
      - { name: city, label: City / state / ZIP, type: string }
      - { name: area, label: Neighborhood, type: string }
      - { name: button_label, label: Button text, type: string }
      - { name: button_url, label: Button link, type: string }
